/* ---------- fusión a 3 vías: local × nube × base ---------- */
function merge(){
  const res={up:0,down:0};if(!SY.ready||!SY.remote)return res;
  const b=SY.base,R=SY.remote,ops=[];let local=false;
  const L=new Map();S.trades.forEach(t=>{if(!t.demo)L.set(docId(t.id),t)});
  const confirmed=k=>!SY.pend.has(k);
  const take=(k,r,l)=>{ /* nube → este dispositivo, conservando lo que es solo local */
    if(!validTrade(r))return;
    const keep={};if(l)LOCAL_T.forEach(f=>{if(l[f]!==undefined)keep[f]=l[f]});
    const n={...r,...keep},i=l?S.trades.indexOf(l):-1;
    if(i>=0)S.trades[i]=n;else S.trades.unshift(n);
    if(confirmed(k))b.t[k]=hT(r);local=true;res.down++;
  };
  const put=(k,l)=>{l.u=Date.now();const data=cleanT(l);R.set(k,data);ops.push({k,data});res.up++};
  const del=k=>{R.delete(k);ops.push({k,del:true})};
  for(const k of new Set([...L.keys(),...R.keys(),...Object.keys(b.t)])){
    const l=L.get(k),r=R.get(k),B=b.t[k],hl=l?hT(l):null,hr=r?hT(r):null;
    if(hl===hr){if(confirmed(k)){if(hl)b.t[k]=hl;else delete b.t[k]}continue}
    if(l&&!r){
      if(B&&hl===B&&confirmed(k)){S.trades.splice(S.trades.indexOf(l),1);delete b.t[k];local=true;res.down++} /* lo borraron en otro dispositivo */
      else put(k,l);
      continue;
    }
    if(!l&&r){if(B&&hr===B)del(k);else take(k,r,null);continue}  /* lo borraste aquí / es nuevo de otro dispositivo */
    const lc=hl!==B,rc=hr!==B;
    if(!lc)take(k,r,l);else if(!rc)put(k,l);else if((l.u||0)>(r.u||0))put(k,l);else take(k,r,l);
  }
  /* ajustes */
  const rs=SY.remoteSet,hls=hS(S.set),hrs=rs?hS(rs):null;
  const takeS=()=>{S.set={...DEFAULTS,...rs,anim:S.set.anim};if(confirmed(SETK))b.set=hrs;local=true};
  const putS=()=>{S.set.u=Date.now();const data=cleanS(S.set);SY.remoteSet=data;ops.push({k:SETK,data,set:true})};
  if(hls===hrs){if(confirmed(SETK))b.set=hls}
  else if(!rs)putS();
  else{const lc=hls!==b.set,rc=hrs!==b.set;
    if(!lc)takeS();else if(!rc)putS();else if((S.set.u||0)>(rs.u||0))putS();else takeS()}

  if(ops.length&&!SY.halt)commit(ops);
  if(local||ops.length)saveLocal();
  saveBase();
  if(local)softRender();
  return res;
}
function commit(ops){
  const F=SY.fb,uid=SY.user.uid;
  for(let i=0;i<ops.length;i+=450){ /* Firestore admite hasta 500 operaciones por lote */
    const chunk=ops.slice(i,i+450),batch=F.fs.writeBatch(F.db);
    chunk.forEach(o=>{
      if(o.set)batch.set(SY.ref.sref,o.data);
      else if(o.del)batch.delete(F.fs.doc(SY.ref.tcol,o.k));
      else batch.set(F.fs.doc(SY.ref.tcol,o.k),o.data);
      SY.pend.set(o.k,(SY.pend.get(o.k)||0)+1);
    });
    SY.inflight++;
    const done=ok=>{
      if(!SY.user||SY.user.uid!==uid)return;
      chunk.forEach(o=>{
        const n=(SY.pend.get(o.k)||1)-1;if(n>0){SY.pend.set(o.k,n);return}  /* hay una escritura más nueva en camino */
        SY.pend.delete(o.k);if(!ok)return;
        if(o.set)SY.base.set=hS(o.data);else if(o.del)delete SY.base.t[o.k];else SY.base.t[o.k]=hT(o.data);
      });
      saveBase();
    };
    batch.commit().then(()=>done(true),e=>{
      done(false);console.warn('[TJ] sync: escritura rechazada',e);
      if(e.code==='permission-denied')return onSyncErr(e);
      SY.halt=true; /* no reintentar en bucle; al recargar se vuelve a intentar */
      toast(ic('alert',16)+(e.code==='resource-exhausted'?' Se alcanzó el límite gratis de hoy. Tus datos siguen guardados aquí y se subirán después.':' No se pudo guardar en la nube ('+esc(e.code||e.message)+')'),'dn');
    }).finally(()=>{SY.inflight--;paintSync()});
  }
}

/* =====================================================================
   OPORTUNIDADES · señales de compra spot con la API pública de Binance
   Regla 'ema200-pb20-v1' (solo velas de 1 h CERRADAS, determinista):
     para la vela t se usa SIEMPRE la ventana fija de las 600 velas que terminan en t,
     así el resultado de una hora no depende de cuándo se calcule.
     Señal de compra si:  cierre > EMA200  y  mínimo ≤ EMA20 < cierre
       (el precio retrocede hasta tocar la EMA 20 y cierra de nuevo por encima).
     Entrada = cierre de t · stop = entrada − 1.5 × ATR14 (Wilder) · objetivo = entrada + 2R.
     Evaluación: 24 velas siguientes; si en una vela toca stop y objetivo, cuenta stop;
     si no toca ninguno, se cierra al cierre de la vela 24.
   Rango 24 h: cierre × exp(± 1.18 × σ72 × √24), σ72 = desv. estándar (n−1) de los
     últimos 72 retornos logarítmicos de 1 h.
   Guardado (con sesión): users/{uid}/opps/{PAR_AAAAMMDDHH} una vez por señal, y
     users/{uid}/meta/opps = {desde, hasta}. Al abrir la pestaña se procesan todas las
     horas cerradas desde 'hasta' (sin huecos).
   ===================================================================== */
/* PENDIENTE al subir OP_RULE a una versión nueva: reiniciar la medición. Si meta/opps.rule !== OP_RULE,
   empezar con desde = última hora cerrada (no seguir con el desde/hasta de la regla anterior). Las señales
   viejas se conservan en opps/ pero ya se filtran por 'rule' en el resumen. */
const OP_PAIRS=['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT'];
const OP_RULE='ema200-pb20-v1',OP_WIN=600,OP_H=24,OP_K=1.18,OP_ATR=1.5,OP_RR=2,HR=36e5;
const OP={c:{},cur:{},sigs:null,meta:null,busy:false,err:'',hour:0,uid:null,saved:0};
const opName=p=>p.replace(/USDT$/,'/USDT');
const opId=(p,t)=>p+'_'+new Date(t).toISOString().slice(0,13).replace(/\D/g,'');
const opHourStr=t=>new Date(t).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false}).replace('.','');

async function opCandles(pair,from){ /* velas de 1 h cerradas desde `from` */
  const out=[];let s=from;
  for(let n=0;n<60;n++){
    const a=await bget(`/api/v3/klines?symbol=${pair}&interval=1h&startTime=${s}&limit=1000`),now=Date.now();
    for(const k of a)if(+k[6]<now)out.push({t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4]});
    if(a.length<1000)break;s=+a[a.length-1][0]+HR;
  }
  return out;
}
async function opEnsure(pair,from){
  let a=OP.c[pair];
  if(!a||!a.length||a[0].t>from)return OP.c[pair]=await opCandles(pair,from);
  const more=await opCandles(pair,a[a.length-1].t+HR);
  if(more.length)a.push(...more);
  return a;
}
function opEval(w){ /* w: exactamente las 600 velas que terminan en la vela evaluada */
  const n=w.length;
  const ema=p=>{let e=0;for(let i=0;i<p;i++)e+=w[i].c;e/=p;const k=2/(p+1);for(let i=p;i<n;i++)e=w[i].c*k+e*(1-k);return e};
  const tr=i=>Math.max(w[i].h-w[i].l,Math.abs(w[i].h-w[i-1].c),Math.abs(w[i].l-w[i-1].c));
  let atr=0;for(let i=1;i<=14;i++)atr+=tr(i);atr/=14;for(let i=15;i<n;i++)atr=(atr*13+tr(i))/14;
  const r=[];for(let i=n-72;i<n;i++)r.push(Math.log(w[i].c/w[i-1].c));
  const m=r.reduce((a,b)=>a+b,0)/r.length,sig=Math.sqrt(r.reduce((a,b)=>a+(b-m)**2,0)/(r.length-1));
  const e200=ema(200),e20=ema(20),x=w[n-1],band=OP_K*sig*Math.sqrt(OP_H);
  const o={t:x.t,close:x.c,low:x.l,e20,e200,atr,sig,lo:x.c*Math.exp(-band),hi:x.c*Math.exp(band),signal:x.c>e200&&x.l<=e20&&x.c>e20&&atr>0};
  if(o.signal){o.entry=x.c;o.stop=x.c-OP_ATR*atr;o.target=x.c+OP_RR*(x.c-o.stop)}
  return o;
}
const opAt=(arr,i)=>i>=OP_WIN-1?opEval(arr.slice(i-OP_WIN+1,i+1)):null;
function opOutcome(s,arr,idx){ /* qué habría pasado con la señal s */
  const i0=idx.get(s.t);if(i0==null)return null;
  for(let j=1;j<=OP_H;j++){
    const k=arr[i0+j];if(!k)return{st:'open',j:j-1,mark:arr[arr.length-1].c};
    if(k.l<=s.stop)return{st:'sl',exit:s.stop,r:-1,j};          /* si también tocó el objetivo, cuenta stop */
    if(k.h>=s.target)return{st:'tp',exit:s.target,r:OP_RR,j};
  }
  const k=arr[i0+OP_H];return{st:'exp',exit:k.c,r:(k.c-s.entry)/(s.entry-s.stop),j:OP_H};
}
function opSize(entry,stop){ /* riesgo % de Ajustes aplicado al capital de aprendizaje; la posición nunca pasa de ese capital */
  const fee=(S.set.feePct||0)/100,cap=Math.max(0,+S.set.learnCap||0),riskUsd=cap*(S.set.riskPct||0)/100;
  const per=(entry-stop)+fee*(entry+stop);
  let qty=per>0?riskUsd/per:0,capped=false;
  if(qty*entry>cap){qty=cap/entry;capped=true}
  return{qty,notional:qty*entry,risk:qty*per,riskUsd,capped};
}
const opPnl=(s,exit)=>{const z=opSize(s.entry,s.stop),fee=(S.set.feePct||0)/100;return z.qty*(exit-s.entry)-fee*z.qty*(s.entry+exit)};

/* ---------- carga, señales sin huecos y guardado ---------- */
async function oppRefresh(force){
  if(OP.busy)return;
  let uid=SY.user&&SY.fb?SY.user.uid:null;const hour=Math.floor(Date.now()/HR),uid0=uid;
  if(!force&&OP.hour===hour&&OP.uid===uid&&!OP.err)return;
  OP.busy=true;OP.err='';paintOpp();
  try{
    let F,root,meta=null,saved=new Map();
    if(uid){
      try{
        F=SY.fb;root=F.fs.doc(F.db,'users',uid);
        const [ms,qs]=await Promise.all([F.fs.getDoc(F.fs.doc(root,'meta','opps')),F.fs.getDocs(F.fs.collection(root,'opps'))]);
        meta=ms.exists()?ms.data():null;qs.forEach(d=>saved.set(d.id,d.data()));
      }catch(e){ /* sin nube: se muestran las tarjetas igual y se guarda en el siguiente intento */
        console.warn('[TJ] oportunidades: nube',e);uid=null;
        OP.err=e.code==='permission-denied'?'Tu cuenta no tiene permiso para guardar señales.':'No se pudo leer tu cuenta (sin conexión). Las señales se guardarán en el próximo intento.';
      }
    }
    const lastGuess=(hour-1)*HR;
    const desde=meta?meta.desde:lastGuess,hasta=meta?meta.hasta:lastGuess-HR;
    const from=Math.min(desde-OP_H*HR,hasta+HR)-OP_WIN*HR;
    const arrs=await Promise.all(OP_PAIRS.map(p=>opEnsure(p,from)));
    const idx={};OP_PAIRS.forEach((p,i)=>{idx[p]=new Map(arrs[i].map((k,j)=>[k.t,j]))});
    OP_PAIRS.forEach((p,i)=>{OP.cur[p]=opAt(arrs[i],arrs[i].length-1)});
    if(uid){
      const L=Math.min(...arrs.map(a=>a[a.length-1].t)),nuevas=[];
      for(let t=hasta+HR;t<=L;t+=HR)OP_PAIRS.forEach((p,i)=>{
        const j=idx[p].get(t);if(j==null)return;
        const e=opAt(arrs[i],j),id=opId(p,t);
        if(e&&e.signal&&!saved.has(id)){
          const d={pair:p,t,rule:OP_RULE,entry:e.entry,stop:e.stop,target:e.target,atr:e.atr,e20:e.e20,e200:e.e200,sig:e.sig,lo:e.lo,hi:e.hi};
          saved.set(id,d);nuevas.push([id,d]);
        }
      });
      const m2={desde,hasta:Math.max(hasta,L),rule:OP_RULE};
      const moved=!meta||m2.hasta!==meta.hasta;
      for(let i=0;i<(moved?Math.max(1,nuevas.length):0);i+=400){
        const b=F.fs.writeBatch(F.db);
        nuevas.slice(i,i+400).forEach(([id,d])=>b.set(F.fs.doc(root,'opps',id),d));
        if(i+400>=nuevas.length)b.set(F.fs.doc(root,'meta','opps'),m2);  /* 'hasta' avanza solo junto con el último lote */
        await b.commit();
      }
      OP.meta=m2;OP.saved=nuevas.length;
      if(nuevas.length)toast(ic('target',16)+` ${nuevas.length} señal${nuevas.length>1?'es':''} nueva${nuevas.length>1?'s':''} guardada${nuevas.length>1?'s':''}`,'up');
    }else OP.meta=null;
    OP.sigs=uid?[...saved.values()].filter(d=>d.rule===OP_RULE).sort((a,b)=>b.t-a.t):null;
    OP.idx=idx;
  }catch(e){console.warn('[TJ] oportunidades',e);OP.err=e.code==='permission-denied'?'Tu cuenta no tiene permiso para guardar señales.':'No se pudieron cargar los datos ('+(e.code||e.message)+'). Toca «Actualizar» para reintentar.'}
  OP.hour=hour;OP.uid=uid0;  /* también tras un error: evita reintentos en bucle; «Actualizar» fuerza otro intento */
  OP.busy=false;
  if(S.ui.view==='opo')softRender();
}

/* ---------- resumen: señales, rango 24 h y comprar y mantener ---------- */
function oppSummary(){
  if(!OP.meta||!OP.sigs)return null;
  const fee=(S.set.feePct||0)/100,cap=Math.max(0,+S.set.learnCap||0),rows=[];
  for(const p of OP_PAIRS){
    const arr=OP.c[p],idx=OP.idx[p];if(!arr)continue;
    const sg=OP.sigs.filter(s=>s.pair===p).map(s=>({s,o:opOutcome(s,arr,idx)})).filter(x=>x.o);
    const done=sg.filter(x=>x.o.st!=='open');
    const tp=done.filter(x=>x.o.st==='tp').length,sl=done.filter(x=>x.o.st==='sl').length,ex=done.length-tp-sl;
    const sumR=done.reduce((a,x)=>a+x.o.r,0),usd=done.reduce((a,x)=>a+opPnl(x.s,x.o.exit),0);
    /* rango: cada hora cerrada desde 'desde' que ya tiene su vela +24 h */
    let cov=0,nc=0;
    const i0=idx.get(OP.meta.desde);
    if(i0!=null)for(let i=Math.max(i0,72);i+OP_H<arr.length;i++){
      const r=[];for(let j=i-71;j<=i;j++)r.push(Math.log(arr[j].c/arr[j-1].c));
      const m=r.reduce((a,b)=>a+b,0)/72,sig=Math.sqrt(r.reduce((a,b)=>a+(b-m)**2,0)/71),b=OP_K*sig*Math.sqrt(OP_H),y=arr[i+OP_H].c;
      nc++;if(y>=arr[i].c*Math.exp(-b)&&y<=arr[i].c*Math.exp(b))cov++;
    }
    const first=i0!=null?arr[i0].c:null,last=arr[arr.length-1].c;
    const bh=first?cap*(1-fee)*(last/first)*(1-fee)-cap:null;
    rows.push({p,n:sg.length,done:done.length,open:sg.length-done.length,tp,sl,ex,sumR,avgR:done.length?sumR/done.length:null,usd,cov:nc?cov/nc:null,nc,bh,bhPct:first?(last/first-1)*100:null,list:sg});
  }
  return rows;
}

/* ---------- vista ---------- */
function oppCard(p){
  const e=OP.cur[p];
  if(!e)return`<div class="card ocard rise"><div class="oh"><b>${opName(p)}</b></div><div class="empty-sm" style="height:120px">${OP.busy?'Cargando velas…':OP.err?'Sin datos':'—'}</div></div>`;
  const span=e.hi-e.lo,pos=x=>clamp((x-(e.lo-span*.25))/(span*1.5)*100,0,100);
  const above=e.close>e.e200,d200=(e.close/e.e200-1)*100;
  let setup;
  if(e.signal){
    const z=opSize(e.entry,e.stop),amb=e.target>e.hi;
    setup=`<div class="osig buy"><h4>${ic('long',16)} Señal de compra <span class="mut" style="font-weight:600">· vela de las ${opHourStr(e.t)}</span></h4>
      <div class="orow"><span>Entrada</span><b>${fmtP(e.entry)}</b></div>
      <div class="orow"><span>Stop (1.5 × ATR)</span><b class="dn">${fmtP(e.stop)}</b></div>
      <div class="orow"><span>Objetivo (2R)</span><b class="up">${fmtP(e.target)}${amb?' · ambicioso':''}</b></div>
      <div class="orow"><span>Riesgo/beneficio</span><b>1 : ${OP_RR}</b></div>
      <div class="orow"><span>Cantidad</span><b>${+z.qty.toPrecision(5)}</b></div>
      <div class="orow"><span>Valor de la posición</span><b>${fmtMoney(z.notional)}</b></div>
      <div class="orow"><span>Riesgo si toca el stop</span><b class="dn">${fmtMoney(z.risk)}</b></div>
      <p class="mut" style="font-size:12px;margin:8px 0 0">${S.set.riskPct}% de riesgo sobre tu capital de aprendizaje (${fmtMoney(+S.set.learnCap||0,false,0)}).${z.capped?` El stop está tan cerca que la posición topa en ese capital: arriesgas ${fmtMoney(z.risk)} en vez de ${fmtMoney(z.riskUsd)}.`:''}</p>
      ${amb?`<p class="mut" style="font-size:12px;margin:8px 0 0">El objetivo queda por encima del rango esperado a 24 h.</p>`:''}
      <button class="btn sm" style="margin-top:10px" data-act="opp-reg" data-pair="${p}">${ic('plus',15)} Registrar como trade</button></div>`;
  }else setup=`<div class="osig"><h4>${ic('shield',16)} Sin setup, fuera del mercado</h4><p class="mut" style="font-size:12px;margin:0">${above?'Precio sobre la EMA 200, pero la última vela no retrocedió a la EMA 20 y cerró por encima.':'Precio por debajo de la EMA 200: la regla solo compra en tendencia alcista.'}</p></div>`;
  return`<div class="card ocard rise"><div class="oh"><b>${opName(p)}</b><span class="mono">${fmtP(e.close)}</span></div>
    <div class="orow"><span>Última vela cerrada</span><b>${opHourStr(e.t)}</b></div>
    <div class="orow"><span>EMA 200 (1 h)</span><b class="${above?'up':'dn'}">${fmtP(e.e200)} · ${above?'precio arriba':'precio abajo'} ${d200>=0?'+':''}${d200.toFixed(2)}%</b></div>
    <div class="orow"><span>EMA 20 (1 h)</span><b>${fmtP(e.e20)}</b></div>
    <div class="orow"><span>Rango esperado 24 h (~80 %)</span><b>${fmtP(e.lo)} – ${fmtP(e.hi)}</b></div>
    <div class="oband" title="Rango esperado a 24 h"><em style="left:${pos(e.lo)}%;width:${pos(e.hi)-pos(e.lo)}%"></em><i style="left:calc(${pos(e.close)}% - 1px)"></i></div>
    ${setup}</div>`;
}
function oppHistoryHtml(rows){
  const st={tp:['Objetivo','up'],sl:['Stop','dn'],exp:['Venció 24 h',''],open:['Abierta','']};
  const all=rows.flatMap(r=>r.list).sort((a,b)=>b.s.t-a.s.t).slice(0,30);
  if(!all.length)return'<p class="mut" style="margin:0">Aún no hay señales desde que empezó la medición.</p>';
  return`<div class="oscroll"><table class="otable"><tr><th>Hora</th><th>Par</th><th>Entrada</th><th>Stop</th><th>Objetivo</th><th>Resultado</th><th>R</th><th>${cur()}</th></tr>
  ${all.map(({s,o})=>{const [l,c]=st[o.st],v=o.st==='open'?null:opPnl(s,o.exit);
    return`<tr><td>${opHourStr(s.t)}</td><td>${opName(s.pair).replace('/USDT','')}</td><td>${fmtP(s.entry)}</td><td>${fmtP(s.stop)}</td><td>${fmtP(s.target)}</td><td class="${c}">${l}${o.st==='open'?` · ${o.j}/24 h`:''}</td><td class="${cls(o.r)}">${o.st==='open'?'—':fmtR(o.r)}</td><td class="${cls(v)}">${v==null?'—':fmtMoney(v,true)}</td></tr>`}).join('')}</table></div>`;
}
function oppSummaryHtml(){
  if(!SY.user)return`<div class="card rise"><div class="card-h"><h3>${ic('chart',18)} ¿Qué habría pasado?</h3></div><p class="mut" style="margin:0 0 14px">Inicia sesión para guardar cada señal en tu cuenta y medir después cómo le fue frente a comprar y mantener.</p><button class="btn btn-pri" data-act="login">Iniciar sesión con Google</button></div>`;
  const rows=oppSummary();
  if(!rows)return`<div class="card rise"><div class="card-h"><h3>${ic('chart',18)} ¿Qué habría pasado?</h3></div><div class="empty-sm" style="height:80px">${OP.busy?'Cargando tus señales…':'—'}</div></div>`;
  const T=rows.reduce((a,r)=>({done:a.done+r.done,tp:a.tp+r.tp,sumR:a.sumR+r.sumR,usd:a.usd+r.usd,bh:a.bh+(r.bh||0)}),{done:0,tp:0,sumR:0,usd:0,bh:0});
  const pct=v=>v==null?'—':(v*100).toFixed(0)+'%';
  return`<div class="card rise"><div class="card-h"><h3>${ic('chart',18)} ¿Qué habría pasado?</h3><span class="mut" style="font-size:12px">desde ${opHourStr(OP.meta.desde)}</span></div>
  <div class="oscroll"><table class="otable"><tr><th>Par</th><th>Señales</th><th>Cerradas</th><th>Ganadas</th><th>R prom.</th><th>Resultado ${cur()}</th><th>Comprar y mantener</th><th>Rango 24 h dentro</th></tr>
  ${rows.map(r=>`<tr><td>${opName(r.p).replace('/USDT','')}</td><td>${r.n}</td><td>${r.done}${r.open?` (+${r.open})`:''}</td><td>${r.done?pct(r.tp/r.done):'—'}</td><td class="${cls(r.avgR)}">${fmtR(r.avgR)}</td><td class="${cls(r.usd)}">${r.done?fmtMoney(r.usd,true):'—'}</td><td class="${cls(r.bh)}">${r.bh==null?'—':fmtMoney(r.bh,true)+` (${r.bhPct>=0?'+':''}${r.bhPct.toFixed(1)}%)`}</td><td>${r.nc?pct(r.cov)+` <span class="mut">de ${r.nc} h</span>`:'—'}</td></tr>`).join('')}
  <tr><td><b>Total</b></td><td></td><td>${T.done}</td><td>${T.done?pct(T.tp/T.done):'—'}</td><td class="${cls(T.sumR)}">${T.done?fmtR(T.sumR/T.done):'—'}</td><td class="${cls(T.usd)}">${T.done?fmtMoney(T.usd,true):'—'}</td><td class="${cls(T.bh)}">${fmtMoney(T.bh,true)} <span class="mut">(×4)</span></td><td></td></tr></table></div>
  <p class="mut" style="font-size:12px;margin:10px 0 0">Cada señal arriesga tu % de riesgo de Ajustes sobre el capital de aprendizaje (${fmtMoney(+S.set.learnCap||0,false,0)}), sin pasar de ese capital; incluye comisiones. "Comprar y mantener" invierte ese mismo capital en cada moneda desde el inicio de la medición. Una señal puede empezar mientras otra sigue abierta.${T.done<30?` <b>Con ${T.done} señal${T.done===1?'':'es'} cerrada${T.done===1?'':'s'} todavía no se puede concluir nada.</b>`:''}</p>
  <div class="card-h" style="margin-top:18px"><h3>${ic('list',18)} Últimas señales</h3></div>${oppHistoryHtml(rows)}</div>`;
}
function paintOpp(){if(S.ui.view==='opo'){const h=$('#oppstat');if(h)h.innerHTML=oppStatus()}}
const oppStatus=()=>OP.busy?'Actualizando…':OP.err?`<span class="dn">${esc(OP.err)}</span>`:OP.hour?`Velas de 1 h cerradas · Binance · ${OP.uid?'señales guardadas en tu cuenta':'sin sesión: no se guarda'}`:'';
function renderOpp(){
  const el=$('#v-opo');
  el.innerHTML=`<div class="card rise" style="margin-bottom:14px"><div class="card-h"><h3>${ic('target',18)} Regla: retroceso a la EMA 20 en tendencia</h3><button class="btn sm" data-act="opp-refresh" ${OP.busy?'disabled':''}>${ic('pulse',15)} Actualizar</button></div>
    <p class="mut" style="margin:0 0 6px;font-size:13px">Solo compras (spot). Hay señal cuando, en velas de 1 hora, el precio está sobre la EMA 200, retrocede hasta tocar la EMA 20 y cierra de nuevo por encima. Stop a 1.5 × ATR(14), objetivo a 2R. Es una regla para medir, no una recomendación.</p>
    <div class="mut" style="font-size:12px" id="oppstat">${oppStatus()}</div></div>
    <div class="ogrid">${OP_PAIRS.map(oppCard).join('')}</div>${oppSummaryHtml()}`;
  const uid=SY.user&&SY.fb?SY.user.uid:null;
  if(!OP.busy&&(OP.hour!==Math.floor(Date.now()/HR)||OP.uid!==uid))setTimeout(()=>oppRefresh(),0);
}
function oppRegister(p){
  const e=OP.cur[p];if(!e||!e.signal)return;
  const z=opSize(e.entry,e.stop);
  openTradeForm({symbol:opName(p),dir:'long',mkt:'spot',strat:'Pullback EMA20',entry:+e.entry.toPrecision(8),sl:+e.stop.toPrecision(8),tp:+e.target.toPrecision(8),qty:+z.qty.toPrecision(6),
    notes:`Señal Oportunidades (${OP_RULE}) de la vela de las ${opHourStr(e.t)}`},'opp');
}
setInterval(()=>{if(S.ui.view==='opo'&&!document.hidden&&!OP.busy&&OP.hour!==Math.floor(Date.now()/HR))oppRefresh()},60000);

/* ---------- arranque ---------- */
load();
const h0=location.hash.slice(1);if(VIEWS[h0])S.ui.view=h0;
render();
syncBoot();
liveTick();setInterval(liveTick,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)liveTick()});
if(!storageOK)toast(ic('alert',16)+' Este navegador bloquea el almacenamiento local','dn');
})();
</script>
