<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Bitácora de Trading</title>
<style>
:root{
  --bg:#07090d;--bg2:#0b0f15;--panel:#0f141b;--panel2:#151c26;--line:#1d2631;--line2:#2a3646;
  --tx:#e8edf3;--mut:#8996a7;--dim:#576374;
  --up:#20d6a0;--up-bg:rgba(32,214,160,.12);--dn:#ff5a6a;--dn-bg:rgba(255,90,106,.12);
  --acc:#5aa2ff;--amb:#f6b73c;--vio:#a78bfa;--r:16px;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:500 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100dvh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 500px at 85% -10%,rgba(90,162,255,.10),transparent 60%),radial-gradient(700px 400px at -10% 110%,rgba(32,214,160,.07),transparent 60%)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}.amb{color:var(--amb)}
.ic{flex:none;display:block}
kbd{font:700 10px var(--mono);padding:2px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--mut)}

/* layout */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;padding:20px 14px;border-right:1px solid var(--line);background:rgba(7,9,13,.7);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:11px;align-items:center;padding:0 6px}
.brand b{display:block;font-weight:800;font-size:15px;letter-spacing:-.01em}
.brand small{color:var(--mut);font-size:11px}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font:800 14px var(--mono);color:#04101f;background:linear-gradient(135deg,var(--up),var(--acc))}
#sidenav{display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;color:var(--mut);font-weight:700;transition:.15s;text-align:left}
.nav:hover{background:var(--panel);color:var(--tx)}
.nav.on{background:var(--panel2);color:var(--tx);box-shadow:inset 3px 0 0 var(--acc)}
.side-foot{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.main{padding:26px 30px 48px;max-width:1440px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.03em;line-height:1}
.top .sub{color:var(--mut);margin-top:6px}
.top-r{display:flex;gap:10px;align-items:center}
.bottom{display:none}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-weight:700;white-space:nowrap;transition:.15s}
.btn:hover{border-color:#41546b;transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn-pri{background:var(--acc);border-color:var(--acc);color:#04101f}
.btn-pri:hover{border-color:#9cc6ff;background:#78b4ff}
.btn-up{background:var(--up);border-color:var(--up);color:#032a1e}
.btn-dn{background:var(--dn);border-color:var(--dn);color:#2b0309}
.btn-ghost{background:transparent}
.btn.wide{width:100%}
.btn.danger{color:var(--dn);border-color:rgba(255,90,106,.35)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--mut);font-weight:700;font-size:13px;white-space:nowrap;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--tx)}
.chip.on{background:var(--tx);border-color:var(--tx);color:#07090d}
.inp{width:100%;height:46px;padding:0 13px;border-radius:12px;background:#0a0e14;border:1px solid var(--line2);outline:0;font-family:var(--mono);font-size:15px;transition:.15s}
.inp::placeholder{color:var(--dim)}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(90,162,255,.18)}
.inp.sm{height:36px;font-size:13px;padding:0 10px}
textarea.inp{height:auto;min-height:76px;padding:11px 13px;resize:vertical;font-family:var(--sans);font-size:14px}
select.inp{appearance:none;font-family:var(--sans);font-weight:600;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:700}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:#0a0e14;border:1px solid var(--line)}
.seg button{height:30px;padding:0 12px;border-radius:8px;color:var(--mut);font-weight:700;font-size:12px}
.seg button.on{background:var(--panel2);color:var(--tx)}
.wideseg{display:flex}.wideseg button{flex:1;height:40px;font-size:14px}.wideseg button.on{background:var(--tx);color:#07090d}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line2);transition:.2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--up)}
.sw input:checked+i::after{transform:translateX(20px)}

/* cards */
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:15px;font-weight:800;letter-spacing:-.01em;display:flex;gap:8px;align-items:center}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*50ms)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:14px}
.kpi{position:relative;overflow:hidden;min-height:118px;display:flex;flex-direction:column;gap:8px}
.kpi .ico{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);color:var(--mut)}
.kpi.t-up .ico{background:var(--up-bg);color:var(--up)}.kpi.t-dn .ico{background:var(--dn-bg);color:var(--dn)}.kpi.t-acc .ico{background:rgba(90,162,255,.14);color:var(--acc)}.kpi.t-amb .ico{background:rgba(246,183,60,.14);color:var(--amb)}
.kv{white-space:nowrap;font-size:clamp(22px,2.1vw,29px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.ks{color:var(--mut);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.ks b{font-weight:700;color:var(--tx)}
.kring{display:flex;align-items:center;gap:10px}.kring .kv{font-size:clamp(22px,1.9vw,27px)}
.ring{width:52px;height:52px;flex:none}
.rbg{fill:none;stroke:var(--line2);stroke-width:7}
.rfg{fill:none;stroke-width:7;stroke-linecap:round;animation:ringin 1.1s cubic-bezier(.2,.8,.2,1) both}
.pfbar{height:7px;border-radius:9px;background:var(--dn);overflow:hidden}
.pfbar i{display:block;height:100%;background:var(--up);animation:wgrow .9s cubic-bezier(.2,.8,.2,1) both}
.limbar{height:7px;border-radius:9px;background:var(--line2);overflow:hidden;position:relative}
.limbar i{display:block;height:100%;border-radius:9px;background:var(--acc);animation:wgrow .9s cubic-bezier(.2,.8,.2,1) both}
.pgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);grid-template-areas:"eq open" "bars open";gap:14px;align-items:start}
.p-eq{grid-area:eq}.p-open{grid-area:open}.p-bars{grid-area:bars}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:14px;align-items:start}
.agrid .full{grid-column:1/-1}
.chart{position:relative;height:270px}
.chart svg{display:block;width:100%;height:100%;touch-action:pan-y}
.chart .ln{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{opacity:0;animation:fade .9s .5s forwards}
.chart text{font:600 10px var(--mono);fill:var(--dim)}
.empty-sm{height:100%;display:grid;place-items:center;color:var(--dim);text-align:center;padding:20px}
.empty{padding:50px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty .big-ic{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;background:var(--panel2);color:var(--acc)}
.empty h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.empty p{color:var(--mut);max-width:420px}

/* banners */
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);margin-bottom:12px;font-weight:600;animation:rise .4s both}
.banner span{flex:1}
.banner.warn{border-color:rgba(246,183,60,.4);background:rgba(246,183,60,.08);color:var(--amb)}
.banner.danger{border-color:rgba(255,90,106,.5);background:var(--dn-bg);color:var(--dn);animation:rise .4s both,pulse 2s infinite}
.banner.info{border-color:rgba(90,162,255,.35);background:rgba(90,162,255,.08);color:var(--acc)}

/* pills / ladder */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font:800 11px var(--mono);letter-spacing:.04em}
.pill.long{background:var(--up-bg);color:var(--up)}.pill.short{background:var(--dn-bg);color:var(--dn)}
.live{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;background:rgba(90,162,255,.16);color:var(--acc);font:800 9px var(--mono);letter-spacing:.06em;vertical-align:middle}
.ladder{position:relative;height:56px;margin:6px 12px 0}
.ladder .bar{position:absolute;left:0;right:0;top:24px;height:8px;border-radius:5px;background:#0a0e14;border:1px solid var(--line);overflow:hidden}
.ladder .zr,.ladder .zg{position:absolute;top:0;bottom:0}
.ladder .zr{background:linear-gradient(90deg,rgba(255,90,106,.65),rgba(255,90,106,.25))}
.ladder .zg{background:linear-gradient(90deg,rgba(32,214,160,.25),rgba(32,214,160,.65))}
.ladder .mk{position:absolute;top:16px;height:24px;width:2px;transform:translateX(-50%);border-radius:2px;background:currentColor}
.ladder .mk em{position:absolute;left:50%;transform:translateX(-50%);top:-15px;font:800 10px var(--mono);font-style:normal}
.ladder .mk.en{color:var(--tx)}.ladder .mk.en em{top:auto;bottom:-15px}
.ladder .mk.sl{color:var(--dn)}.ladder .mk.tp{color:var(--up)}
.ladder .dot{position:absolute;top:20px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:2.5px solid #fff;background:var(--mut);transition:left 1s cubic-bezier(.2,.8,.2,1);z-index:3}
.ladder .dot.g{background:var(--up);box-shadow:0 0 14px var(--up)}.ladder .dot.r{background:var(--dn);box-shadow:0 0 14px var(--dn)}
.op{padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--bg2);margin-bottom:10px;animation:rise .45s both;animation-delay:calc(var(--i,0)*60ms);transition:border-color .2s}
.op:last-child{margin-bottom:0}
.op-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.op-h b{font-size:15px;font-weight:800}
.op-h .pnl{margin-left:auto;font-size:17px;font-weight:800}
.op-f{display:flex;align-items:flex-end;gap:10px;margin-top:10px}
.op-f label{flex:1;display:flex;flex-direction:column;gap:4px}
.op-f .r{min-width:62px;text-align:right;font-weight:800;padding-bottom:8px}
.op.hit-tp{border-color:var(--up);animation:rise .45s both,glowUp 1.6s infinite}
.op.hit-sl{border-color:var(--dn);animation:rise .45s both,glowDn 1.6s infinite}
.hitbar{margin-top:10px;display:flex;gap:8px;align-items:center;font-weight:800;font-size:13px}
.hit-tp .hitbar{color:var(--up)}.hit-sl .hitbar{color:var(--dn)}

/* breakdown rows */
.bd{padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;animation:rise .4s both;animation-delay:calc(var(--i,0)*45ms)}
.bd:last-child{border-bottom:0}.bd:hover .bd-top b{color:var(--acc)}
.bd-top{display:flex;gap:10px;align-items:baseline}
.bd-top b{font-weight:800;font-size:14.5px;transition:.15s}
.bd-top .mono{margin-left:auto;font-weight:800}
.wl{display:flex;height:8px;border-radius:6px;overflow:hidden;background:var(--line2);margin:8px 0 7px;gap:2px}
.wl i{display:block;height:100%;animation:wgrow .9s cubic-bezier(.2,.8,.2,1) both}
.wl .w{background:var(--up)}.wl .l{background:var(--dn)}.wl .b{background:var(--dim)}
.bd-sub{display:flex;gap:16px;color:var(--mut);font-size:12px;flex-wrap:wrap}
.bd-sub b{color:var(--tx);font-family:var(--mono)}
.cols{display:flex;gap:6px;align-items:stretch}
.col{flex:1;display:flex;flex-direction:column;min-width:0;cursor:default}
.barwrap{flex:1;position:relative}
.barwrap i{position:absolute;left:10%;right:10%;height:var(--h);min-height:2px;border-radius:5px;animation:growh .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*35ms)}
.cols.sm .barwrap i{left:8%;right:8%;border-radius:3px}
.cols:not(.dv) .barwrap i{bottom:0}
.cols.dv .barwrap i.pos{bottom:50%;border-radius:5px 5px 0 0}.cols.dv .barwrap i.neg{top:50%;border-radius:0 0 5px 5px}
.cols.dv .barwrap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line2)}
.barwrap i.pos{background:linear-gradient(0deg,rgba(32,214,160,.45),var(--up))}
.barwrap i.neg{background:linear-gradient(180deg,rgba(255,90,106,.45),var(--dn))}
.barwrap i.acc{background:linear-gradient(0deg,rgba(90,162,255,.4),var(--acc))}
.col span{font:700 10px var(--mono);color:var(--mut);text-align:center;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col:hover .barwrap i{filter:brightness(1.3)}
.hl2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg2)}
.mini .v{font-size:24px;font-weight:800;margin:4px 0 8px;letter-spacing:-.02em}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px 12px}
.mgrid div{display:flex;flex-direction:column;gap:3px}
.mgrid b{font-family:var(--mono);font-size:16px;font-weight:800}
.ins{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);margin-bottom:8px;animation:rise .4s both;animation-delay:calc(var(--i,0)*70ms)}
.ins .ii{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.ins.up .ii{background:var(--up-bg);color:var(--up)}.ins.dn .ii{background:var(--dn-bg);color:var(--dn)}.ins.warn .ii{background:rgba(246,183,60,.14);color:var(--amb)}
.ins p{padding-top:4px}.ins p b{font-weight:800}

/* journal */
.fbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-bottom:12px}
.fbar .search{position:relative}
.fbar .search .ic{position:absolute;left:13px;top:15px;color:var(--dim)}
.fbar .search .inp{padding-left:38px;font-family:var(--sans)}
.fbar .row2{grid-column:1/-1;display:flex;gap:8px;align-items:center;min-width:0}
.fbar select.inp{width:auto;min-width:150px;height:46px}
.jsum{display:flex;gap:18px;flex-wrap:wrap;color:var(--mut);font-size:13px;margin:6px 2px 12px}
.jsum b{color:var(--tx);font-family:var(--mono)}
.thead,.row{display:grid;grid-template-columns:96px minmax(130px,1.3fr) 82px repeat(4,minmax(80px,1fr)) 64px 72px minmax(96px,1fr) 28px;gap:10px;align-items:center;padding:0 14px}
.thead{height:34px;color:var(--dim);font:700 10px var(--sans);letter-spacing:.09em;text-transform:uppercase}
.trade{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel),var(--bg2));margin-bottom:8px;animation:rise .4s both;animation-delay:calc(var(--i,0)*30ms);transition:border-color .2s}
.trade:hover{border-color:var(--line2)}
.trade.open{border-color:#334357}
.trade.fresh{animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both,flashrow 1.4s}
.row{min-height:56px;cursor:pointer;font-size:13.5px}
.row:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;border-radius:14px}
.c-sym b{display:block;font-weight:800;font-size:14.5px}
.c-sym small{color:var(--mut);font-size:12px}
.c-pnl{font-weight:800;font-size:14.5px;text-align:right}
.c-r{text-align:right;font-weight:700}
.c-chev{color:var(--dim);transition:transform .25s}
.trade.open .c-chev{transform:rotate(180deg)}
.c[data-l]::before{display:none}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.2,.8,.2,1)}
.trade.open .detail{grid-template-rows:1fr}
.detail>div{overflow:hidden}
.dpad{padding:6px 14px 16px;border-top:1px solid var(--line)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:18px 0 12px}
.dgrid div{display:flex;flex-direction:column;gap:2px}
.dgrid b{font-family:var(--mono);font-weight:800}
.note{padding:10px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);color:#c4cdd9;margin-bottom:10px;white-space:pre-wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tag{padding:3px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line2);font-size:12px;font-weight:700}
.tag.star{color:var(--amb);display:inline-flex;gap:2px;align-items:center}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* modal */
.mback{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(2,4,8,.72);backdrop-filter:blur(6px);animation:fade .18s}
.modal{width:min(660px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:20px;animation:pop .28s cubic-bezier(.2,.9,.3,1.1);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.sm{width:min(420px,100%)}
.mback.out{animation:fadeout .18s forwards}.mback.out .modal{animation:popout .18s forwards}
.mh{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.mh h3{font-size:18px;font-weight:800;letter-spacing:-.02em}
.mb{padding:18px;display:flex;flex-direction:column;gap:16px}
.mf{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
.mf .btn{flex:1}
.xbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mut)}
.xbtn:hover{background:var(--panel2);color:var(--tx)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dirsel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dirsel label{position:relative}
.dirsel input{position:absolute;opacity:0}
.dirsel span{height:54px;border-radius:14px;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px;letter-spacing:.04em;transition:.15s;color:var(--mut)}
.dirsel input[value=long]:checked+span{border-color:var(--up);background:var(--up-bg);color:var(--up)}
.dirsel input[value=short]:checked+span{border-color:var(--dn);background:var(--dn-bg);color:var(--dn)}
.pv{padding:14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.pv-g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.pv-g div{display:flex;flex-direction:column;gap:2px}.pv-g b{font-family:var(--mono);font-weight:800;font-size:14px}
.errs{display:flex;flex-direction:column;gap:5px;margin-top:10px;font-size:13px;font-weight:600}
.errs .e{color:var(--dn);display:flex;gap:6px;align-items:center}.errs .w{color:var(--amb);display:flex;gap:6px;align-items:center}
.swrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);font-weight:700}
.stars{display:flex;gap:2px}.stars button{color:var(--dim);padding:2px;transition:.15s}.stars button.on{color:var(--amb)}.stars button.on svg{fill:var(--amb)}
.big-res{font-size:34px;font-weight:800;letter-spacing:-.03em}
.qk{display:flex;gap:8px;flex-wrap:wrap}

/* settings */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.strat-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line2);font-weight:700}
.strat-chip button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}.strat-chip button:hover{background:var(--dn-bg);color:var(--dn)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* misc */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:11px 16px;border-radius:12px;background:#1b2531;border:1px solid var(--line2);font-weight:700;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:rise .3s both;display:flex;gap:8px;align-items:center}
.toast.up{border-color:var(--up)}.toast.dn{border-color:var(--dn)}.toast.out{animation:fadeout .25s forwards}
#tip{position:fixed;z-index:95;pointer-events:none;padding:8px 11px;border-radius:10px;background:#1b2531;border:1px solid var(--line2);font:600 12px/1.5 var(--mono);box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .1s;max-width:240px}
#tip.on{opacity:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80;display:none}
#flash{position:fixed;inset:0;pointer-events:none;z-index:79;opacity:0;background:radial-gradient(circle at 50% 55%,transparent 30%,rgba(255,90,106,.35))}
#flash.go{animation:flashred .7s}
.rpop{position:fixed;left:50%;top:42%;z-index:85;font-size:clamp(46px,12vw,92px);font-weight:900;letter-spacing:-.04em;pointer-events:none;animation:rpop 1.5s cubic-bezier(.2,.8,.2,1) forwards;text-shadow:0 0 40px currentColor}
.shake{animation:shake .45s}
.savedot{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);font-weight:700}
.savedot i{width:7px;height:7px;border-radius:50%;background:var(--up);transition:.3s}
.savedot.flash i{box-shadow:0 0 0 6px rgba(32,214,160,.25);transform:scale(1.3)}
.livechip{display:inline-flex;gap:7px;align-items:center;font-size:11px;font-weight:700;color:var(--mut);margin-top:6px}
.livechip i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.livechip.on i{background:var(--up);box-shadow:0 0 0 4px rgba(32,214,160,.2);animation:pulse 2s infinite}
.livechip.off i{background:var(--dn)}
/* sincronización */
.syncst{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);font-weight:700;margin-top:6px}
.syncst i,#syncchip i{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.syncst.ok i,#syncchip.ok i{background:var(--acc)}
.syncst.pending i,.syncst.loading i,#syncchip.pending i,#syncchip.loading i{background:var(--amb)}
.syncst.offline i,.syncst.error i,#syncchip.offline i,#syncchip.error i{background:var(--dn)}
#syncchip{margin-left:10px}
@media(min-width:901px){#syncchip{display:none!important}}
.suser{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);margin-bottom:12px}
.suser img,.suser .av{width:40px;height:40px;border-radius:50%;flex:none;background:var(--line);display:grid;place-items:center;font-weight:800}
.suser b{display:block;overflow-wrap:anywhere}
body.noanim *,body.noanim *::before,body.noanim *::after{animation:none!important;transition:none!important}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
@keyframes popout{to{opacity:0;transform:scale(.96) translateY(8px)}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetout{to{transform:translateY(100%)}}
@keyframes wgrow{from{width:0}}
@keyframes growh{from{height:0}}
@keyframes ringin{from{stroke-dasharray:0 400}}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,90,106,.14)}}
@keyframes glowUp{50%{box-shadow:0 0 0 5px rgba(32,214,160,.16),0 0 24px rgba(32,214,160,.25)}}
@keyframes glowDn{50%{box-shadow:0 0 0 5px rgba(255,90,106,.16),0 0 24px rgba(255,90,106,.25)}}
@keyframes flashrow{0%{background:rgba(90,162,255,.3)}100%{background:transparent}}
@keyframes flashred{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
@keyframes rpop{0%{opacity:0;transform:translate(-50%,30px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.08)}70%{opacity:1;transform:translate(-50%,-30px) scale(1)}100%{opacity:0;transform:translate(-50%,-90px) scale(1)}}

/* responsive */
.show-m{display:none!important}
/* oportunidades */
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px;align-items:start;margin-bottom:14px}
.ocard .oh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.ocard .oh b{font-size:18px}.ocard .oh .mono{font-size:20px;font-weight:800}
.orow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.orow span:first-child{color:var(--mut)}.orow b{font-family:var(--mono);text-align:right}
.oband{position:relative;height:8px;border-radius:99px;background:var(--line);margin:10px 0 4px}
.oband i{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;background:var(--tx)}
.oband em{position:absolute;top:0;height:8px;border-radius:99px;background:rgba(90,162,255,.35)}
.osig{margin-top:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg2)}
.osig.buy{border-color:rgba(32,214,160,.45)}
.osig h4{font-size:14px;font-weight:800;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.otable{width:100%;border-collapse:collapse;font-size:13px}
.otable th{font:700 10.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--mut);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
.otable td{font-family:var(--mono);text-align:right;padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.otable th:first-child,.otable td:first-child{text-align:left}
.oscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:1179px){
  .thead{display:none}
  .row{grid-template-columns:1fr 1fr 1fr;grid-template-areas:"sym sym pnl" "dir date r" "ent sl tp";row-gap:10px;padding:13px 14px}
  .c-sym{grid-area:sym}.c-pnl{grid-area:pnl;font-size:18px}.c-dir{grid-area:dir}.c-date{grid-area:date}.c-r{grid-area:r}.c-ent{grid-area:ent}.c-sl{grid-area:sl}.c-tp{grid-area:tp}
  .c-exit,.c-rrp,.c-chev{display:none}
  .c[data-l]::before{display:block;content:attr(data-l);font:700 9px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:1px}
  .c-date{font-size:12px;color:var(--mut)}
  .pgrid{grid-template-columns:minmax(0,1fr);grid-template-areas:"open" "eq" "bars"}
}
@media(max-width:900px){
  .shell{display:block}.side{display:none}
  .main{padding:16px 14px calc(104px + env(safe-area-inset-bottom))}
  .hide-m{display:none!important}
  .show-m{display:grid!important}
  .top{margin-bottom:14px}
  .bottom{display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:6px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(11,15,21,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);align-items:end}
  .bn{display:flex;flex-direction:column;align-items:center;gap:3px;height:52px;justify-content:center;color:var(--dim);font-size:10.5px;font-weight:700;border-radius:12px}
  .bn.on{color:var(--tx)}.bn.on .ic{color:var(--acc)}
  .fab{width:58px;height:58px;border-radius:20px;margin:-26px auto 0;background:linear-gradient(135deg,var(--up),var(--acc));color:#04101f;display:grid;place-items:center;box-shadow:0 10px 30px rgba(32,214,160,.35);transition:.15s}
  .fab:active{transform:scale(.92)}
  #toast{bottom:calc(96px + env(safe-area-inset-bottom))}
  .chart{height:230px}
  .fbar{grid-template-columns:1fr}
  .fbar select.inp{width:100%}
  .fbar .row2{flex-direction:column;align-items:stretch}
}
@media(max-width:700px){
  .mback{align-items:flex-end;padding:0}
  .modal{width:100%;max-height:94dvh;border-radius:22px 22px 0 0;animation:sheet .32s cubic-bezier(.2,.8,.2,1)}
  .modal.sm{width:100%}
  .mback.out .modal{animation:sheetout .2s forwards}
  .inp{font-size:16px}
  .pv-g{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .kgrid{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{min-height:112px;padding:14px}
  .hl2{grid-template-columns:1fr 1fr}
}
@media(max-width:380px){.g3{grid-template-columns:1fr 1fr}.kv{font-size:22px}}
</style>

<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="logo">TJ</div><div><b>Bitácora</b><small>Trading Journal</small></div></div>
    <nav id="sidenav"></nav>
    <button class="btn btn-pri wide" data-act="new" id="sidenew"></button>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <main class="main" id="main">
    <header class="top">
      <div><h1 id="title"></h1><div class="sub" id="subtitle"></div><div id="livechip"></div><span id="syncchip"></span></div>
      <div class="top-r">
        <div id="rangebar" class="chips"></div>
        <button class="btn btn-pri hide-m" data-act="new" id="topnew"></button>
        <button class="xbtn show-m" data-act="nav" data-view="set" id="topset" aria-label="Ajustes"></button>
      </div>
    </header>
    <section id="v-panel" class="view"></section>
    <section id="v-bit" class="view" hidden></section>
    <section id="v-opo" class="view" hidden></section>
    <section id="v-ana" class="view" hidden></section>
    <section id="v-set" class="view" hidden></section>
  </main>
</div>
<nav class="bottom" id="bottomnav"></nav>
<input type="file" id="impcsv" accept=".csv,text/csv,text/plain" hidden>
<div id="modalroot"></div><div id="toast"></div><div id="tip"></div><canvas id="fx"></canvas><div id="flash"></div>

<script>
(()=>{'use strict';
/* =====================================================================
   BITÁCORA DE TRADING · módulo autónomo
   Capas: Store → Calc/Stats → Charts → UI.  API pública: window.TJ
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(v);return Number.isFinite(n)?n:null};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;

/* ---------- iconos ---------- */
const IC={
 panel:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
 chart:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',
 sliders:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
 check:'<path d="M5 12l5 5 9-10"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',chev:'<path d="M6 9l6 6 6-6"/>',
 down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',up:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
 target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',bolt:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
 long:'<path d="M7 17L17 7M9 7h8v8"/>',short:'<path d="M7 7l10 10M17 9v8H9"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',star:'<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.3l1-6.2L3 9.7l6.2-.9z"/>',
 alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.1"/>',search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',
 wallet:'<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="14" r="1.2"/>',
 pulse:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',scale:'<path d="M12 3v18M5 21h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0zM5 7h14"/>',
 flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',
 drop:'<path d="M3 5l6 8 4-4 8 9"/><path d="M21 12v6h-6"/>',
 bars:'<path d="M5 20V10M12 20V4M19 20v-7"/>',trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v2a3 3 0 0 0 4 3M16 6h4v2a3 3 0 0 1-4 3M12 13v4M8 20h8"/>'
};
const ic=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;

/* ---------- estado y persistencia ---------- */
const KEY='tj.v1';
const DEFAULTS={capital:10000,riskPct:1,maxOpenRisk:5,dailyLoss:3,currency:'USD',anim:true,auto:true,feePct:0,learnCap:600,lastBackup:null,
  strategies:['Breakout','Pullback','Reversal','Rango','Noticias'],symbols:['BTC/USDT','ETH/USDT','SOL/USDT','BNB/USDT','XRP/USDT']};
const S={trades:[],set:{...DEFAULTS},prev:{},ui:{view:'panel',range:'all',eq:'equity',bar:'usd',limit:60,open:null,fresh:null,
  sort:'new',f:{q:'',status:'all',dir:'all',strat:'all',res:'all'}}};
let storageOK=true,saveTimer=null;
const validTrade=t=>t&&typeof t==='object'&&t.id&&(t.dir==='long'||t.dir==='short')&&Number.isFinite(+t.entry)&&Number.isFinite(+t.sl)&&Number.isFinite(+t.qty)&&t.openAt;
function load(){
  try{const raw=localStorage.getItem(KEY);if(!raw)return;const d=JSON.parse(raw);
    S.trades=(Array.isArray(d.trades)?d.trades:[]).filter(validTrade);S.set={...DEFAULTS,...(d.set||{})};
  }catch(e){storageOK=false;console.warn('[TJ] no se pudo leer localStorage',e)}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({v:1,trades:S.trades,set:S.set}));storageOK=true;flashSaved()}
  catch(e){storageOK=false;console.warn('[TJ] no se pudo guardar',e);toast(ic('alert',16)+' Sin almacenamiento: exporta tu respaldo','dn')}
  window.dispatchEvent(new CustomEvent('tj:change',{detail:{trades:S.trades.length}}));
  syncPush();
}
const saveSoon=()=>{clearTimeout(saveTimer);saveTimer=setTimeout(save,400)};
function flashSaved(){$$('.savedot').forEach(el=>{el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),700)})}

/* ---------- formato ---------- */
const SYM={USD:'$',MXN:'$',EUR:'€'};
const cur=()=>SYM[S.set.currency]||'$';
const fmtMoney=(v,sign=false,dec=2)=>{if(v==null||!Number.isFinite(v))return'—';const a=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});return(v<0?'−':sign&&v>0?'+':'')+cur()+a};
const fmtK=v=>{const a=Math.abs(v);const s=a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e4?(a/1e3).toFixed(1)+'k':a>=1e3?(a/1e3).toFixed(2)+'k':a.toFixed(0);return(v<0?'−':'')+cur()+s};
const fmtP=p=>{if(p==null||!Number.isFinite(p))return'—';const a=Math.abs(p);const d=a>=1000?2:a>=1?4:a>=.01?5:8;return p.toLocaleString('en-US',{maximumFractionDigits:d})};
const fmtR=r=>r==null||!Number.isFinite(r)?'—':(r>0?'+':r<0?'−':'')+Math.abs(r).toFixed(2)+'R';
const fmtPF=v=>Number.isFinite(v)?v.toFixed(2):'∞';
const cls=v=>v>0?'up':v<0?'dn':'';
const fmtDate=iso=>iso?new Date(iso).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false}).replace('.',''):'—';
const fmtDay=iso=>new Date(iso).toLocaleDateString('es-MX',{day:'2-digit',month:'short'}).replace('.','');
const fmtDur=ms=>{if(!Number.isFinite(ms)||ms<0)return'—';const m=Math.round(ms/6e4);if(m<60)return m+' min';const h=m/60;if(h<48)return h.toFixed(1)+' h';return(h/24).toFixed(1)+' d'};
const pad2=n=>String(n).padStart(2,'0');
const toLocalInput=iso=>{const d=iso?new Date(iso):new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes())};
const animOK=()=>S.set.anim!==false&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- cálculos ---------- */
const dirv=t=>t.dir==='long'?1:-1;
const MMR=0.005; /* margen de mantenimiento aprox. */
const liqPrice=t=>t.mkt==='fut'&&t.lev>0?(t.dir==='long'?t.entry*(1-1/t.lev+MMR):t.entry*(1+1/t.lev-MMR)):null;
function calc(t){
  const risk=Math.abs(t.entry-t.sl)*t.qty;
  const rrPlan=t.tp!=null&&t.entry!==t.sl?Math.abs(t.tp-t.entry)/Math.abs(t.entry-t.sl):null;
  let pnl=null,r=null,gross=null;
  if(t.exit!=null){gross=(t.exit-t.entry)*dirv(t)*t.qty;pnl=gross-(t.fees||0);r=risk>0?pnl/risk:null}
  return{risk,rrPlan,pnl,r,gross};
}
const floatPnl=t=>t.exit==null&&t.mark!=null?(t.mark-t.entry)*dirv(t)*t.qty-(t.fees||0):null;
const openRisk=t=>t.exit==null?Math.max(0,(t.entry-t.sl)*dirv(t)*t.qty):0;
function hit(t){
  if(t.exit!=null||t.mark==null)return null;
  if(t.dir==='long'){if(t.tp!=null&&t.mark>=t.tp)return'tp';if(t.mark<=t.sl)return'sl'}
  else{if(t.tp!=null&&t.mark<=t.tp)return'tp';if(t.mark>=t.sl)return'sl'}
  return null;
}
const closedTrades=()=>S.trades.filter(t=>t.exit!=null&&t.closeAt).sort((a,b)=>new Date(a.closeAt)-new Date(b.closeAt));
const equityNow=()=>S.set.capital+closedTrades().reduce((a,t)=>a+calc(t).pnl,0);
function inRange(t){const r=S.ui.range;if(r==='all')return true;return new Date(t.closeAt)>=Date.now()-(+r)*864e5}
function stats(list,base){
  const o={n:list.length,wins:0,losses:0,be:0,gw:0,gl:0,net:0,sumR:0,rN:0,pts:[],maxDD:0,maxDDpct:0,sW:0,sL:0,cur:0,best:null,worst:null,dur:[]};
  let eq=base,peak=base,w=0,l=0;
  o.pts.push({t:list[0]?list[0].openAt:null,v:base,dd:0,tr:null});
  list.forEach(t=>{
    const m=calc(t),p=m.pnl;
    if(p>0){o.wins++;o.gw+=p;w++;l=0}else if(p<0){o.losses++;o.gl-=p;l++;w=0}else{o.be++;w=0;l=0}
    o.sW=Math.max(o.sW,w);o.sL=Math.max(o.sL,l);
    o.net+=p;eq+=p;peak=Math.max(peak,eq);
    const dd=peak-eq,ddp=peak>0?dd/peak*100:0;
    o.maxDD=Math.max(o.maxDD,dd);o.maxDDpct=Math.max(o.maxDDpct,ddp);
    if(m.r!=null){o.sumR+=m.r;o.rN++}
    if(o.best==null||p>o.best)o.best=p;if(o.worst==null||p<o.worst)o.worst=p;
    o.dur.push(new Date(t.closeAt)-new Date(t.openAt));
    o.pts.push({t:t.closeAt,v:eq,dd:ddp,tr:t,p,r:m.r});
  });
  o.cur=w>0?w:l>0?-l:0;
  o.wr=o.n?o.wins/o.n*100:0;
  o.pf=o.gl>0?o.gw/o.gl:(o.gw>0?Infinity:0);
  o.avgW=o.wins?o.gw/o.wins:0;o.avgL=o.losses?o.gl/o.losses:0;
  o.payoff=o.avgL>0?o.avgW/o.avgL:(o.avgW>0?Infinity:0);
  o.exp=o.n?o.net/o.n:0;o.expR=o.rN?o.sumR/o.rN:0;
  o.rec=o.maxDD>0?o.net/o.maxDD:null;
  o.kelly=Number.isFinite(o.payoff)&&o.payoff>0?(o.wr/100-(1-o.wr/100)/o.payoff):null;
  o.avgDur=avg(o.dur);o.end=eq;
  return o;
}
function groupBy(list,fn){
  const m=new Map();list.forEach(t=>{const k=fn(t);if(k==null||k==='')return;(m.get(k)||m.set(k,[]).get(k)).push(t)});
  return[...m].map(([key,l])=>({key,list:l,...stats(l,0)})).sort((a,b)=>b.net-a.net);
}

function ladder(t,{final=true}={}){
  const cur=t.exit!=null?t.exit:t.mark;
  const pts=[t.entry,t.sl];if(t.tp!=null)pts.push(t.tp);if(cur!=null)pts.push(cur);
  let lo=Math.min(...pts),hi=Math.max(...pts);const pd=(hi-lo)*.1||Math.abs(t.entry)*.01||1;lo-=pd;hi+=pd;
  const pos=p=>clamp((p-lo)/(hi-lo)*100,0,100);
  const e=pos(t.entry),s=pos(t.sl),tp=t.tp!=null?pos(t.tp):null;

    dot=`<i class="dot ${d>0?'g':d<0?'r':''}" style="left:${final||!animOK()?x:e}%" data-to="${x}" title="${fmtP(cur)}"></i>`}
  return`<div class="ladder"><div class="bar"><b class="zr" style="left:${Math.min(e,s)}%;width:${Math.abs(e-s)}%"></b>${tp!=null?`<b class="zg" style="left:${Math.min(e,tp)}%;width:${Math.abs(e-tp)}%"></b>`:''}</div>

function confetti(n=140){
  const cv=$('#fx'),ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);cv.style.display='block';
  const cols=['#20d6a0','#5aa2ff','#f6b73c','#a78bfa','#ffffff'];
  const P=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*140,y:innerHeight*.5,vx:(Math.random()-.5)*15,vy:-Math.random()*17-4,g:.36+Math.random()*.2,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[(Math.random()*cols.length)|0]}));
  const t0=performance.now();
  const loop=now=>{const dt=now-t0;ctx.clearRect(0,0,innerWidth,innerHeight);let alive=0;
    P.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;
      if(p.y<innerHeight+20){alive++;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,1-dt/2800);ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);ctx.restore()}});
    if(alive&&dt<2800)requestAnimationFrame(loop);else{ctx.clearRect(0,0,innerWidth,innerHeight);cv.style.display='none'}};
  requestAnimationFrame(loop);
}

  const hv=$('.hv',svg),hl=$('line',hv),hc=$('circle',hv);

/* lectura del analista */
function insights(list,base){
  const out=[],st=stats(list,base);
  if(!list.length)return[{t:'warn',i:'alert',x:'Cierra operaciones para generar lectura automática.'}];
  if(list.length<30)out.push({t:'warn',i:'alert',x:`Muestra de <b>${list.length}</b> trades: todavía no es fiable estadísticamente (meta ≥ 30 por estrategia).`});
  const gs=groupBy(list,t=>t.strat).filter(g=>g.n>=4);
  if(gs.length>1){const b=[...gs].sort((x,y)=>y.expR-x.expR)[0],w=[...gs].sort((x,y)=>x.expR-y.expR)[0];
    if(b.expR>0)out.push({t:'up',i:'bolt',x:`<b>${esc(b.key)}</b> es tu mejor edge: ${fmtR(b.expR)} por trade en ${b.n} operaciones. Prioridad uno.`});
    if(w.expR<0&&w!==b)out.push({t:'dn',i:'alert',x:`<b>${esc(w.key)}</b> pierde ${fmtR(w.expR)} por trade (${w.n} ops). Pausa o corrige reglas.`})}
  const bad=list.filter(t=>['FOMO','Venganza','Miedo'].includes(t.emo));
  if(bad.length>=3){const s=stats(bad,0);if(s.net<0)out.push({t:'dn',i:'flame',x:`Operar con FOMO, miedo o venganza te costó <b>${fmtMoney(s.net)}</b> en ${bad.length} trades.`})}
  const wins=list.filter(t=>calc(t).pnl>0&&t.tp!=null);
  if(wins.length>=5){const real=avg(wins.map(t=>calc(t).r)),plan=avg(wins.map(t=>calc(t).rrPlan));
    if(real<plan*.75)out.push({t:'warn',i:'target',x:`Tus ganadores cierran en <b>${real.toFixed(1)}R</b> vs <b>${plan.toFixed(1)}R</b> planeado: sales antes del TP.`})}
  const los=list.filter(t=>calc(t).pnl<0);
  if(los.length>=5){const lr=avg(los.map(t=>calc(t).r));if(lr<-1.15)out.push({t:'dn',i:'shield',x:`Tu pérdida promedio es <b>${fmtR(lr)}</b>: el SL no se respeta (deslizamiento o stop movido).`})}
  if(st.maxDDpct>=10)out.push({t:'warn',i:'drop',x:`Drawdown máximo de <b>${st.maxDDpct.toFixed(1)}%</b>. Reduce el riesgo por trade hasta recuperar.`});
  if(st.expR>0.15&&list.length>=30)out.push({t:'up',i:'trophy',x:`Edge positivo confirmado: ${fmtR(st.expR)} por trade en ${list.length} operaciones.`});
  return out.slice(0,5);
}

function filtered(){
  const f=S.ui.f,q=f.q.trim().toLowerCase();
  let l=S.trades.filter(t=>{
    if(q&&!(`${t.symbol} ${t.strat} ${t.notes||''} ${t.emo||''}`.toLowerCase().includes(q)))return false;
    const closed=t.exit!=null;
    if(f.status==='open'&&closed)return false;if(f.status==='closed'&&!closed)return false;
    if(f.dir!=='all'&&t.dir!==f.dir)return false;
    if(f.strat!=='all'&&t.strat!==f.strat)return false;
    if(f.res!=='all'){if(!closed)return false;const p=calc(t).pnl;if(f.res==='win'&&!(p>0))return false;if(f.res==='loss'&&!(p<0))return false}

const EMOS=['Calma','Confianza','FOMO','Miedo','Venganza','Aburrimiento'];
function validate(d,closed){
  const e=[],w=[];
  if(!d.symbol)e.push('Falta el símbolo');
  if(!(d.entry>0))e.push('Precio de entrada inválido');
  if(!(d.sl>0))e.push('Define tu Stop Loss');
  if(d.entry>0&&d.sl>0){
    if(d.dir==='long'&&d.sl>=d.entry)e.push('En LONG el SL va por debajo de la entrada');
    if(d.dir==='short'&&d.sl<=d.entry)e.push('En SHORT el SL va por encima de la entrada')}
  if(d.tp!=null&&d.entry>0){
    if(d.dir==='long'&&d.tp<=d.entry)e.push('En LONG el TP va por encima de la entrada');
    if(d.dir==='short'&&d.tp>=d.entry)e.push('En SHORT el TP va por debajo de la entrada')}
  if(!(d.qty>0))e.push('Cantidad inválida');
  if(!d.openAt)e.push('Falta la fecha de entrada');
  if(closed){
    if(!(d.exit>0))e.push('Precio de salida inválido');
    if(!d.closeAt)e.push('Falta la fecha de cierre');else if(d.openAt&&new Date(d.closeAt)<new Date(d.openAt))e.push('El cierre es anterior a la entrada')}
  if(d.mkt==='fut'){
    if(!(d.lev>=1))e.push('Apalancamiento inválido (mínimo 1x)');
    else if(d.entry>0&&d.sl>0){const lq=liqPrice(d);
      if(lq!=null&&((d.dir==='long'&&d.sl<=lq)||(d.dir==='short'&&d.sl>=lq)))w.push('Tu SL queda más allá de la liquidación: te liquidan antes del stop');
      if(d.qty>0&&d.qty*d.entry/d.lev>equityNow())w.push('El margen requerido supera tu capital')}
  }
  if(d.tp==null)w.push('Sin TP no hay R:R planeado');
  else if(!e.length){const rr=Math.abs(d.tp-d.entry)/Math.abs(d.entry-d.sl);if(rr<1)w.push('R:R menor a 1:1: necesitas más de 50% de aciertos')}
  return{e,w};
}

  const m=openModal(`<div class="mh"><h3>Cerrar ${esc(t.symbol)} ${t.dir==='long'?'▲':'▼'}</h3><button class="xbtn" data-act="mclose" aria-label="Cerrar">${ic('x',20)}</button></div>

    <div class="pv" style="text-align:center"><span class="lbl">Resultado</span><div class="big-res mono" id="c-res">—</div><div class="mut mono" id="c-r"></div></div></div>
  <div class="mf"><button class="btn" data-act="mclose">Cancelar</button><button class="btn btn-up" id="c-ok">${ic('check',18)} Confirmar cierre</button></div>`);
  const g=id=>$('#'+id,m);
  const sync=()=>{
    const ex=num(g('c-exit').value),fees=num(g('c-fees').value)||0;
    $('#cl-lad',m).innerHTML=ladder({...t,exit:ex>0?ex:null,mark:null},{final:true});
    if(!(ex>0)){g('c-res').textContent='—';g('c-res').className='big-res mono';g('c-r').textContent='';g('c-ok').disabled=true;g('c-ok').style.opacity=.45;return}
    const p=(ex-t.entry)*dir*t.qty-fees,r=m0.risk>0?p/m0.risk:null;
    g('c-res').textContent=fmtMoney(p,true);g('c-res').className='big-res mono '+cls(p);g('c-r').textContent=fmtR(r);g('c-ok').disabled=false;g('c-ok').style.opacity=1;
  };
  m.addEventListener('input',sync);
  m.addEventListener('click',ev=>{const q=ev.target.closest('[data-q]');if(q){g('c-exit').value=q.dataset.q;sync()}});
  g('c-ok').addEventListener('click',()=>{
    const ex=num(g('c-exit').value);if(!(ex>0))return;
    t.exit=ex;t.fees=num(g('c-fees').value)||0;t.closeAt=g('c-date').value?new Date(g('c-date').value).toISOString():new Date().toISOString();t.mark=null;
    if(new Date(t.closeAt)<new Date(t.openAt))t.closeAt=new Date().toISOString();
    const mm=calc(t);save();closeModal();closeFx(mm.pnl,mm.r);
    toast(`${ic('check',16)} Cerrado ${fmtMoney(mm.pnl,true)} · ${fmtR(mm.r)}`,mm.pnl>0?'up':mm.pnl<0?'dn':'');
    S.prev={};render();
  });
  sync();
}

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeDemo(){
  const rnd=mulberry(20261107),pick=a=>a[(rnd()*a.length)|0],now=Date.now();
  const strats=[{n:'Breakout',wr:.45,rr:[1.8,3]},{n:'Pullback',wr:.58,rr:[1.3,2]},{n:'Reversal',wr:.36,rr:[2.2,3.5]},{n:'Rango',wr:.52,rr:[.9,1.4]},{n:'Noticias',wr:.28,rr:[1.2,2]}];
  const syms=[['BTC/USDT',95000],['ETH/USDT',3300],['SOL/USDT',165],['BNB/USDT',620],['XRP/USDT',2.3]];
  const emos=['Calma','Calma','Calma','Confianza','FOMO','Miedo','Venganza',''];
  const P=x=>+x.toPrecision(7);
  let cap=S.set.capital,t=now-62*864e5;const out=[];
  for(;;){
    t+=(.4+rnd()*1.9)*864e5;if(t>now-30*36e5)break;
    const st=pick(strats),[sym,px]=pick(syms),dir=rnd()<.55?'long':'short',dv=dir==='long'?1:-1;
    const entry=P(px*(.9+rnd()*.2)),sd=entry*(.008+rnd()*.017),rr=+(st.rr[0]+rnd()*(st.rr[1]-st.rr[0])).toFixed(1);
    const emo=pick(emos),bad=['FOMO','Venganza','Miedo'].includes(emo);
    const rating=emo?(bad?1+((rnd()*3)|0):3+((rnd()*3)|0)):0;
    const wp=Math.min(.8,st.wr*1.6*(bad?.6:1)*(emo==='Calma'?1.08:1));
    let R;const u=rnd();
    if(rnd()<.06)R=(rnd()-.5)*.1;else if(u<wp)R=rr*(rnd()<.3?.5+.4*rnd():1);else R=-(1+(rnd()<.2?rnd()*.35:0));
    const riskPct=bad&&rnd()<.5?2:pick([.5,1,1,1,1.5]),qty=P(cap*riskPct/100/sd);
    const exit=P(entry+dv*R*sd),fees=+(qty*entry*.0006).toFixed(2);
    const closeAt=Math.min(t+(1+rnd()*30)*36e5,now-36e5);
    const pnl=(exit-entry)*dv*qty-fees;cap+=pnl;

const nk=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const COLS={openAt:['fecha','fechaentrada','fechaapertura','abierto','apertura','date','opendate','open','fechayhora'],closeAt:['fechacierre','cerrado','cierre','closedate','close','fechasalida'],
 symbol:['simbolo','par','activo','symbol','pair','ticker','moneda','cripto'],dir:['direccion','tipo','lado','side','direction','posicion'],strat:['estrategia','strategy','setup'],
 entry:['entrada','precioentrada','entry','entryprice','preciodeentrada'],sl:['sl','stop','stoploss'],tp:['tp','takeprofit','objetivo'],
 exit:['salida','preciosalida','exit','exitprice','preciodesalida','preciocierre'],qty:['cantidad','tamano','size','qty','contratos'],
 fees:['comisiones','comision','fees','fee','comisionfunding'],lev:['apalancamiento','leverage','lev','x'],mkt:['mercado','market'],
 notes:['notas','notes','comentarios','comentario'],pnl:['pnl','pyg','resultado','ganancia','profit','gananciaperdida']};
function parseCSV(text){
  text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'';
  const sep=[',',';','\t'].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===sep){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
    else cur+=c}
  row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);return rows;
}
const pn=v=>{if(v==null)return null;const s=String(v).trim().replace(/[$€\s]/g,'').replace(/,/g,'');if(!s)return null;const n=parseFloat(s);return Number.isFinite(n)?n:null};
const pd=v=>{const s=nk(v);if(['long','buy','compra','largo','l','alcista'].includes(s))return'long';if(['short','sell','venta','corto','s','bajista'].includes(s))return'short';return null};
function parseDate(v){v=String(v||'').trim();if(!v)return null;
  const m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[ T]+(\d{1,2}):(\d{2}))?/);
  if(m){let y=+m[3];if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1],+(m[4]||12),+(m[5]||0));return isNaN(d)?null:d.toISOString()}
  const d=new Date(v);return isNaN(d)?null:d.toISOString()}
function importCSV(text){
  const rows=parseCSV(text);
  const head=(rows[0]||[]).map(nk),idx={};
  Object.entries(COLS).forEach(([k,al])=>{const i=head.findIndex(h=>al.includes(h));if(i>=0)idx[k]=i});
  const names={openAt:'Fecha',closeAt:'Fecha cierre',symbol:'Símbolo',dir:'Dirección',strat:'Estrategia',entry:'Entrada',sl:'SL',tp:'TP',exit:'Salida',qty:'Cantidad',fees:'Fees',lev:'Apalancamiento',mkt:'Mercado',notes:'Notas',pnl:'PnL'};
  const get=(r,k)=>idx[k]!=null?r[idx[k]]:undefined;
  const out=[],skip=[];
  if(rows.length>1&&idx.symbol!=null&&idx.entry!=null)rows.slice(1).forEach((r,n)=>{
    const ln=n+2,symbol=String(get(r,'symbol')||'').trim().toUpperCase().replace(/^([A-Z0-9]{2,10}?)(USDT|USDC|USD)$/,'$1/$2'),entry=pn(get(r,'entry')),qty=pn(get(r,'qty'));
    let sl=pn(get(r,'sl')),tp=pn(get(r,'tp')),exit=pn(get(r,'exit')),fees=pn(get(r,'fees'))||0,pnl=pn(get(r,'pnl')),dir=pd(get(r,'dir'));
    if(!symbol){skip.push(`fila ${ln}: sin símbolo`);return}
    if(!(entry>0)){skip.push(`fila ${ln}: sin precio de entrada`);return}
    if(!dir&&sl>0)dir=sl<entry?'long':'short';
    if(!dir&&tp>0)dir=tp>entry?'long':'short';
    if(!dir){skip.push(`fila ${ln}: no pude deducir Long/Short`);return}
    if(!(qty>0)){skip.push(`fila ${ln}: sin cantidad`);return}
    const dv=dir==='long'?1:-1;let note=String(get(r,'notes')||'').trim();
    if(!(sl>0)){sl=entry;note=('[sin SL original] '+note).trim()}
    const openAt=parseDate(get(r,'openAt'))||new Date().toISOString();let closeAt=parseDate(get(r,'closeAt'));
    if(exit==null&&pnl!=null)exit=+(entry+dv*(pnl+fees)/qty).toPrecision(8);
    if(exit>0&&!closeAt)closeAt=openAt;if(closeAt&&new Date(closeAt)<new Date(openAt))closeAt=openAt;
    const mk=nk(get(r,'mkt')||''),lev=pn(get(r,'lev')),fut=lev>0&&(lev>1||/^(fut|perp)/.test(mk));
    out.push({id:uid()+n,dir,symbol,strat:String(get(r,'strat')||'').trim(),openAt,entry,sl,tp:tp>0?tp:null,qty,fees,exit:exit>0?exit:null,closeAt:exit>0?closeAt:null,notes:note,emo:'',rating:0,mkt:fut?'fut':'spot',lev:fut?lev:null});

  openModal(`<div class="mh"><h3>Importación</h3><button class="xbtn" data-act="mclose" aria-label="Cerrar">${ic('x',20)}</button></div><div class="mb">
    <div class="big-res ${out.length?'up':'dn'}">${out.length} importados</div>
    <div><span class="lbl">Columnas reconocidas</span><div class="chips" style="margin-top:8px">${Object.keys(idx).map(k=>`<span class="tag">${names[k]}</span>`).join('')||'<span class="mut">Ninguna</span>'}</div></div>
    ${idx.symbol==null||idx.entry==null?`<div class="banner warn" style="margin:0">${ic('alert',20)}<span>Necesito al menos las columnas <b>Símbolo</b> y <b>Entrada</b>. Descarga la plantilla y copia tus datos ahí.</span></div>`:''}
    ${sinSL?`<div class="banner warn" style="margin:0">${ic('alert',20)}<span>${sinSL} sin SL: entran a la bitácora pero sin R real. Edítalos si recuerdas el stop.</span></div>`:''}
    ${skip.length?`<div><span class="lbl">Omitidos (${skip.length})</span><div class="errs">${skip.slice(0,12).map(x=>`<div class="w">${ic('alert',14)} ${esc(x)}</div>`).join('')}</div></div>`:''}</div>
    <div class="mf"><button class="btn btn-pri" data-act="mclose">Listo</button></div>`);
}

/* ---------- precios en vivo + auto-cierre (API pública de Binance) ---------- */
const HOSTS=['https://api.binance.com','https://data-api.binance.vision'];
const IVS=[['1m',6e4],['5m',3e5],['15m',9e5],['1h',36e5]];
let host=0;const live={ok:null,busy:false};
const pairOf=sym=>{const s=String(sym).toUpperCase().replace(/[^A-Z0-9]/g,'');return/(USDT|USDC|BUSD|FDUSD)$/.test(s)?s:s+'USDT'};
const canAuto=t=>t.exit==null&&!t.verify&&t.sl!==t.entry&&!t.noFeed;
async function bget(path){
  let err;
  for(let k=0;k<HOSTS.length;k++){
    const i=(host+k)%HOSTS.length;
    try{const r=await fetch(HOSTS[i]+path,{cache:'no-store'});
      if(r.status===400)throw new Error('400');
      if(!r.ok){err=new Error('http '+r.status);continue}
      host=i;return await r.json()}
    catch(e){if(e.message==='400')throw e;err=e}}
  throw err||new Error('red');
}
async function klines(pair,from,iv,to){
  const a=await bget(`/api/v3/klines?symbol=${pair}&interval=${iv}&startTime=${Math.floor(from)}${to?`&endTime=${Math.floor(to)}`:''}&limit=1000`);
  return a.map(k=>({t:+k[0],h:+k[2],l:+k[3],c:+k[4]}));
}
function touch(t,c){const L=t.dir==='long';return{sl:L?c.l<=t.sl:c.h>=t.sl,tp:t.tp!=null&&(L?c.h>=t.tp:c.l<=t.tp)}}
async function findHit(t){
  const pair=pairOf(t.symbol),from=Math.max(new Date(t.openAt).getTime(),t.scanned||0),age=Date.now()-from;
  const [ivn,ivms]=IVS.find(([n,ms])=>age<ms*990)||IVS[3];
  const cs=await klines(pair,from,ivn);
  for(const c of cs){
    const x=touch(t,c);if(!x.sl&&!x.tp)continue;
    if(x.sl&&x.tp){ /* SL y TP en la misma vela: refinar con velas de 1m */
      if(ivn!=='1m'){const fine=await klines(pair,c.t,'1m',c.t+ivms-1);
        for(const f of fine){const y=touch(t,f);if(y.sl||y.tp)return{kind:y.sl?'sl':'tp',t:f.t,amb:y.sl&&y.tp}}}
      return{kind:'sl',t:c.t,amb:true};
    }
    return{kind:x.sl?'sl':'tp',t:c.t,amb:false};
  }
  t.scanned=cs.length?cs[cs.length-1].t:from;
  return{kind:null};
}
function autoClose(t,h){
  const px=h.kind==='sl'?t.sl:t.tp;
  t.exit=px;t.closeAt=new Date(Math.max(h.t,new Date(t.openAt).getTime())).toISOString();t.mark=null;t.auto=h.kind;delete t.scanned;
  if(!(t.fees>0)&&S.set.feePct>0)t.fees=+(S.set.feePct/100*(t.entry+px)*t.qty).toFixed(4);
  if(h.amb)t.notes=((t.notes||'')+' [auto: SL y TP en la misma vela, asumí SL]').trim();
  return calc(t);
}
function announce(t,m){
  const sl=t.auto==='sl';
  toast(`${ic(sl?'shield':'target',16)} ${esc(t.symbol)} cerrado en ${sl?'SL':'TP'} · ${fmtMoney(m.pnl,true)} · ${fmtR(m.r)}`,m.pnl>0?'up':m.pnl<0?'dn':'');
  closeFx(m.pnl,m.r);
}
function paintLive(){
  const el=$('#livechip');if(!el)return;
  const n=S.trades.filter(t=>t.exit==null).length;
  if(S.set.auto===false||!n){el.className='';el.innerHTML='';return}
  el.className='livechip '+(live.ok===true?'on':live.ok===false?'off':'');
  el.innerHTML='<i></i>'+(live.ok===true?'En vivo · auto-cierre activo':live.ok===false?'Sin conexión a precios · reintentando':'Conectando…');
}
async function liveTick(){
  if(S.set.auto===false)return;
  if(live.busy){live.again=true;return}
  if(!S.trades.some(t=>t.exit==null)){paintLive();return}
  live.busy=true;let changed=false,dirty=false;
  try{
    for(const t of S.trades.filter(canAuto)){
      try{const h=await findHit(t);
        if(h.kind){announce(t,autoClose(t,h));changed=true}else dirty=true}
      catch(e){if(e.message==='400'){t.noFeed=true;dirty=true}else throw e}
    }
    const pairs=[...new Set(S.trades.filter(t=>t.exit==null&&!t.noFeed).map(t=>pairOf(t.symbol)))];
    if(pairs.length){
      const arr=await bget('/api/v3/ticker/price?symbols='+encodeURIComponent(JSON.stringify(pairs)));
      const mp=Object.fromEntries(arr.map(x=>[x.symbol,+x.price]));
      S.trades.forEach(t=>{const v=mp[pairOf(t.symbol)];if(t.exit==null&&v!=null)t.mark=v});
    }
    live.ok=true;
  }catch(e){live.ok=false;console.warn('[TJ] precios en vivo:',e.message)}
  live.busy=false;paintLive();
  if(changed){save();S.prev={};render()}else{if(dirty)saveSoon();softRefreshOpen()}
  if(live.again){live.again=false;liveTick()}
}

  SY.ref={tcol:F.fs.collection(root,'trades'),sref:F.fs.doc(root,'meta','settings')};
